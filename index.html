<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PicVoc Web — Học Từ Vựng Tiếng Anh Qua Hình Ảnh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857'
            }
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #f4f7fb;
      color: #0f172a;
      -webkit-tap-highlight-color: transparent;
    }
    .perspective-1000 { perspective: 1000px; }
    .preserve-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    .card-flip { transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1); }
    .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -8px rgba(15, 23, 42, 0.12); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.96) translateY(6px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop { animation: popIn 0.22s ease-out forwards; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Header -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200/80">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between gap-2">
      <button id="btn-brand-home" type="button" class="flex items-center gap-2.5 text-left focus:outline-none shrink-0">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 text-white flex items-center justify-center shadow-sm">
          <i data-lucide="image" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <span class="font-extrabold text-lg tracking-tight text-slate-900">PicVoc</span>
            <span id="db-status-badge" class="inline-flex items-center gap-1 text-[10px] font-bold px-1.5 py-0.5 rounded-md bg-emerald-100 text-emerald-700">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
              <span>Cloud</span>
            </span>
          </div>
          <p class="text-[11px] text-slate-500 hidden sm:block leading-none mt-0.5">Học từ vựng qua hình ảnh</p>
        </div>
      </button>

      <!-- Desktop Nav -->
      <nav class="hidden md:flex items-center gap-1 bg-slate-100 p-1 rounded-xl" aria-label="Điều hướng chính">
        <button data-nav="home" type="button" class="nav-btn px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1.5 transition">
          <i data-lucide="layout-grid" class="w-4 h-4"></i>
          <span>Chủ đề</span>
        </button>
        <button data-nav="learn" type="button" class="nav-btn px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1.5 transition">
          <i data-lucide="book-open" class="w-4 h-4"></i>
          <span>Học từ</span>
        </button>
        <button data-nav="flashcard" type="button" class="nav-btn px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1.5 transition">
          <i data-lucide="layers" class="w-4 h-4"></i>
          <span>Flashcard</span>
        </button>
        <button data-nav="quiz" type="button" class="nav-btn px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1.5 transition">
          <i data-lucide="help-circle" class="w-4 h-4"></i>
          <span>Kiểm tra</span>
        </button>
        <button data-nav="favorites" type="button" class="nav-btn px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1.5 transition">
          <i data-lucide="star" class="w-4 h-4"></i>
          <span>Yêu thích</span>
        </button>
      </nav>

      <!-- Voice / Account Controls -->
      <div class="flex items-center gap-1.5">
        <button id="btn-accent" type="button" title="Chuyển giọng đọc Anh - Mỹ / Anh - Anh"
          class="px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100 text-xs font-bold text-slate-700 flex items-center gap-1 transition">
          <i data-lucide="volume-2" class="w-3.5 h-3.5 text-emerald-600"></i>
          <span id="accent-label">US</span>
        </button>
        <button id="btn-voice-settings" type="button" title="Cài đặt giọng đọc & tốc độ"
          class="w-8 h-8 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100 text-slate-600 flex items-center justify-center transition">
          <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
        </button>
        <button id="btn-auth" type="button" title="Tài khoản đồng bộ tiến độ"
          class="px-2.5 py-1.5 rounded-lg border border-emerald-200 bg-emerald-50 hover:bg-emerald-100 text-xs font-bold text-emerald-800 flex items-center gap-1.5 transition">
          <i data-lucide="user" class="w-3.5 h-3.5"></i>
          <span id="auth-label" class="hidden sm:inline">Đăng nhập</span>
        </button>
      </div>
    </div>
  </header>

  </main>

      <span>Học từ</span>

    <button data-nav="flashcard" type="button" class="mobile-nav-btn flex flex-col items-center justify-center py-1 rounded-lg text-[11px] font-semibold">
      <i data-lucide="layers" class="w-5 h-5 mb-0.5"></i>

    <button data-nav="quiz" type="button" class="mobile-nav-btn flex flex-col items-center justify-center py-1 rounded-lg text-[11px] font-semibold">
      <i data-lucide="help-circle" class="w-5 h-5 mb-0.5"></i>
      <span>Kiểm tra</span>
    </button>

      <i data-lucide="star" class="w-5 h-5 mb-0.5"></i>
      <span>Yêu thích</span>
    </button>
  </nav>

  </div>

  <div id="voice-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/55 backdrop-blur-xs p-3 sm:p-5">
    <div id="voice-modal-card" class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-5 animate-pop border border-slate-200 space-y-4"></div>
  </div>

  <div id="auth-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/55 backdrop-blur-xs p-3 sm:p-5">

    // Live data arrays (populated from Supabase)

    function normalizeTopic(row) {
      const style = TOPIC_COLOR_STYLES[row.color] || TOPIC_COLOR_STYLES.emerald;
      return {
        id: row.id,
        name: row.name,
        viName: row.vi_name || row.name,
        description: row.description || '',
        icon: row.icon || 'book-open',
        sortOrder: row.sort_order || 0,
        ...style
      };
    }

    function normalizeVocab(row) {
      return {
        id: row.id,
        topic: row.topic_id,
        word: row.word,
        pos: row.pos || 'noun',
        level: row.level || 'B1',
        ipaUS: row.ipa_us || '',
        ipaUK: row.ipa_uk || '',
        vi: row.vi || '',
        enDef: row.en_def || '',
        example: row.example || '',
        exampleVi: row.example_vi || '',
        collocations: Array.isArray(row.collocations) ? row.collocations : [],
        image: row.image_url || BUNDLED_IMAGES[row.id] || '',
        audioUS: row.audio_us_url || '',
        audioUK: row.audio_uk_url || ''
      };
    }

    // Persistent Local State (fallback when guest)

    // =========================================================
    // 2. SMART AUDIO ENGINE (Natural US Audio + Real Dictionary MP3)
    // =========================================================
    const dictAudioCache = new Map();
    let currentAudioObj = null;
    let audioCtx = null;

    function playChime(type) {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (type === 'correct') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.14);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.26);
        } else {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(160, now + 0.16);
          gain.gain.setValueAtTime(0.11, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.23);
        }
      } catch (e) {}
    }

    function scoreVoiceQuality(v, acc) {
      const name = (v.name || '').toLowerCase();
      const lang = (v.lang || '').toLowerCase();
      const wantLang = acc === 'UK' ? 'en-gb' : 'en-us';
      let score = 0;
      if (lang === wantLang) score += 100;
      else if (lang.startsWith(wantLang)) score += 80;
      else if (lang.startsWith('en')) score += 10;
      else return -100;

      // Strongly boost Neural / Natural / Online / Google smooth voices
      if (name.includes('natural')) score += 70;
      if (name.includes('neural')) score += 70;
      if (name.includes('online')) score += 50;
      if (name.includes('aria') || name.includes('jenny') || name.includes('ava') || name.includes('emma')) score += 45;
      if (name.includes('google us english') || name.includes('google uk english')) score += 60;
      if (name.includes('samantha') || name.includes('daniel') || name.includes('karen')) score += 35;
      // Penalize old robotic Windows SAPI voices
      if (name.includes('david') || name.includes('zira') || name.includes('mark')) score -= 35;
      return score;
    }

    function pickBestVoice(acc) {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices() || [];
      if (!voices.length) return null;
      const prefName = acc === 'UK' ? state.preferredUKVoice : state.preferredUSVoice;
      if (prefName) {
        const exact = voices.find(v => v.name === prefName);
        if (exact) return exact;
      }
      const ranked = voices
        .map(v => ({ v, s: scoreVoiceQuality(v, acc) }))
        .filter(x => x.s > 0)
        .sort((a, b) => b.s - a.s);
      return ranked.length ? ranked[0].v : null;
    }

    async function fetchDictionaryAudio(word, acc) {
      const clean = word.trim().toLowerCase();
      if (!clean || clean.includes(' ')) return null;
      const key = clean + '|' + acc;
      if (dictAudioCache.has(key)) return dictAudioCache.get(key);
      try {
        const res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(clean));
        if (!res.ok) {
          dictAudioCache.set(key, null);
          return null;
        }
        const data = await res.json();
        const phonetics = [];
        if (Array.isArray(data)) {
          data.forEach(entry => {
            if (Array.isArray(entry.phonetics)) {
              entry.phonetics.forEach(p => {
                if (p.audio && p.audio.startsWith('http')) phonetics.push(p.audio);
              });
            }
          });
        }
        const tag = acc === 'UK' ? '-uk' : '-us';
        const match = phonetics.find(u => u.toLowerCase().includes(tag)) || phonetics[0] || null;
        dictAudioCache.set(key, match);
        return match;
      } catch (e) {
        return null;
      }
    }

    function playMp3Url(url, rate) {
      return new Promise((resolve, reject) => {
        try {
          if (currentAudioObj) {
            currentAudioObj.pause();
            currentAudioObj = null;
          }
          const audio = new Audio(url);
          audio.playbackRate = rate || 1.0;
          currentAudioObj = audio;
          audio.onended = () => resolve(true);
          audio.onerror = () => reject(new Error('Audio failed'));
          audio.play().then(() => resolve(true)).catch(reject);
        } catch (err) {
          reject(err);
        }
      });
    }

    function speakWithTTS(text, acc, rate) {
      try {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = acc === 'UK' ? 'en-GB' : 'en-US';
        utter.rate = rate || state.speechRate;
        const best = pickBestVoice(acc);
        if (best) utter.voice = best;
        window.speechSynthesis.speak(utter);
      } catch (e) {}
    }

    async function speakText(text, customAccent, customRate, wordObj) {
      const acc = customAccent || state.accent;
      const rate = customRate || state.speechRate;
      if (currentAudioObj) {
        try { currentAudioObj.pause(); } catch (e) {}
      }
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }

      // 1. Custom MP3 stored in Supabase
      const dbUrl = wordObj ? (acc === 'UK' ? wordObj.audioUK : wordObj.audioUS) : '';
      if (dbUrl) {
        try {
          await playMp3Url(dbUrl, rate);
          return;
        } catch (e) {}
      }

      // 2. Real human-recorded dictionary MP3 for single words (fixes robotic US voice!)
      if (state.useRealDictAudio && text && !text.trim().includes(' ')) {
        const dictUrl = await fetchDictionaryAudio(text, acc);
        if (dictUrl) {
          try {
            await playMp3Url(dictUrl, rate);
            return;
          } catch (e) {}
        }
      }

      // 3. Smart Natural Neural browser TTS fallback
      speakWithTTS(text, acc, rate);
    }

    // =========================================================
    // 3. SUPABASE DATA & AUTH SYNC
    // =========================================================
    async function loadDataFromSupabase(showNotify) {
      state.loading = true;
      render();
      let loaded = false;
      if (supabaseClient) {
        try {
          const [topicsRes, vocabRes] = await Promise.all([
            supabaseClient.from('topics').select('*').order('sort_order', { ascending: true }),
            supabaseClient.from('vocab').select('*').order('created_at', { ascending: true })
          ]);
          if (!topicsRes.error && !vocabRes.error && Array.isArray(topicsRes.data) && topicsRes.data.length) {
            TOPICS = topicsRes.data.map(normalizeTopic);
            VOCAB = (vocabRes.data || []).map(normalizeVocab);
            state.dbOnline = true;
            loaded = true;
          }
        } catch (e) {}
      }
      if (!loaded) {
        TOPICS = FALLBACK_TOPICS.map(normalizeTopic);
        VOCAB = FALLBACK_VOCAB.map(normalizeVocab);
        state.dbOnline = false;
      }
      if (TOPICS.length && state.topicFilter !== 'all' && !TOPICS.some(t => t.id === state.topicFilter)) {
        state.topicFilter = TOPICS[0].id;
      }
      state.loading = false;
      if (showNotify) {
        showToast(state.dbOnline ? `Đã tải ${VOCAB.length} từ từ Supabase` : 'Đang dùng dữ liệu dự phòng ngoại tuyến');
      }
      render();
    }

    async function loadUserProgressFromCloud() {
      if (!supabaseClient || !state.user) return;
      try {
        const { data, error } = await supabaseClient
          .from('user_progress')
          .select('vocab_id, is_learned, is_favorite')
          .eq('user_id', state.user.id);
        if (!error && Array.isArray(data)) {
          state.learned = new Set(data.filter(r => r.is_learned).map(r => r.vocab_id));
          state.favorites = new Set(data.filter(r => r.is_favorite).map(r => r.vocab_id));
          saveState();
          render();
        }
      } catch (e) {}
    }

    async function syncWordProgressToCloud(wordId) {
      if (!supabaseClient || !state.user) return;
      try {
        await supabaseClient.from('user_progress').upsert({
          user_id: state.user.id,
          vocab_id: wordId,
          is_learned: state.learned.has(wordId),
          is_favorite: state.favorites.has(wordId),
          updated_at: new Date().toISOString()
        }, { onConflict: 'user_id,vocab_id' });
      } catch (e) {}
    }

    async function initAuth() {
      if (!supabaseClient) return;
      try {
        const { data } = await supabaseClient.auth.getSession();
        if (data && data.session && data.session.user) {
          state.user = data.session.user;
          await loadUserProgressFromCloud();
        }
        supabaseClient.auth.onAuthStateChange(async (_event, session) => {
          state.user = session ? session.user : null;
          if (state.user) {
            await loadUserProgressFromCloud();
          }
          render();
        });
      } catch (e) {}
    }

    // =========================================================
    // 4. UI HELPERS & STATE ACTIONS
    // =========================================================
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      const txt = document.getElementById('toast-text');
      if (!el || !txt) return;
      txt.textContent = msg;
      el.classList.remove('hidden');
      el.classList.add('flex');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.add('hidden');
        el.classList.remove('flex');
      }, 2400);
    }

    function getTopicObj(topicId) {
      return TOPICS.find(t => t.id === topicId) || TOPICS[0] || normalizeTopic(FALLBACK_TOPICS[0]);
    }

    function getWordsByTopic(topicId) {
      if (topicId === 'all') return VOCAB.slice();
      return VOCAB.filter(w => w.topic === topicId);
    }

    function getTopicProgress(topicId) {
      const words = getWordsByTopic(topicId);
      const done = words.filter(w => state.learned.has(w.id)).length;
      const pct = words.length ? Math.round((done / words.length) * 100) : 0;
      return { done, total: words.length, pct };
    }

    function toggleLearned(wordId, silent) {
      if (state.learned.has(wordId)) {
        state.learned.delete(wordId);
        if (!silent) showToast('Đã bỏ đánh dấu thuộc');
      } else {
        state.learned.add(wordId);
        if (!silent) showToast('Đã đánh dấu thuộc từ này');
      }
      saveState();
      syncWordProgressToCloud(wordId);
      render();
      if (state.modalWordId === wordId) renderModal(wordId);
    }

    function toggleFavorite(wordId) {
      if (state.favorites.has(wordId)) {
        state.favorites.delete(wordId);
        showToast('Đã bỏ khỏi mục Yêu thích');
      } else {
        state.favorites.add(wordId);
        showToast('Đã lưu vào mục Yêu thích');
      }
      saveState();
      syncWordProgressToCloud(wordId);
      render();
      if (state.modalWordId === wordId) renderModal(wordId);
    }

    function renderWordVisual(w, sizeClass) {
      if (w.image) {
        return `<img src="${escapeAttr(w.image)}" alt="${escapeAttr(w.word)}" class="w-full h-full object-contain" loading="lazy" />`;
      }
      const topicObj = getTopicObj(w.topic);
      return `
        <div class="w-full h-full rounded-xl ${topicObj.accentBg} flex flex-col items-center justify-center p-3 text-center">
          <i data-lucide="${topicObj.icon}" class="${sizeClass || 'w-10 h-10'} ${topicObj.accentText} opacity-80 mb-1.5"></i>
          <span class="text-xs font-extrabold ${topicObj.accentText} uppercase tracking-wide">${escapeHtml(w.word.slice(0, 14))}</span>
        </div>
      `;
    }

    function setView(view, opts = {}) {
      state.view = view;
      if (opts.topic) state.topicFilter = opts.topic;
      if (view === 'flashcard') {
        if (opts.fcFilter) state.fcFilter = opts.fcFilter;
        initFlashcards();
      }
      if (view === 'quiz') {
        if (opts.quizTopic) state.quizTopic = opts.quizTopic;
        if (opts.quizMode) state.quizMode = opts.quizMode;
        if (opts.autoStart) startQuiz();
        else state.quizActive = false;
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();

    function renderHome() {
      const totalWords = VOCAB.length || 1;
      const totalLearned = state.learned.size;
      const totalPct = Math.round((totalLearned / totalWords) * 100);
      const q = state.searchQuery.trim().toLowerCase();
      const searchMatches = q
        ? VOCAB.filter(w =>
            w.word.toLowerCase().includes(q) ||
            w.vi.toLowerCase().includes(q) ||
            w.enDef.toLowerCase().includes(q)
          )
        : [];

      const topicCardsHtml = TOPICS.map(t => {
        const prog = getTopicProgress(t.id);
        const words = getWordsByTopic(t.id);

              </button>

      }).join('');

      const searchResultsHtml = q ? `
        <div class="mt-3 bg-white rounded-2xl border border-slate-200 p-3 shadow-sm">
          <div class="flex items-center justify-between mb-2 px-1">
            <span class="text-xs font-bold text-slate-500">Kết quả tìm kiếm (${searchMatches.length})</span>

      return `
        <section class="space-y-6">
          <!-- Hero Progress Banner -->
          <div class="bg-gradient-to-br from-emerald-600 via-teal-600 to-cyan-700 rounded-3xl p-5 sm:p-6 text-white shadow-md">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white/15 text-xs font-semibold mb-2">
                  <i data-lucide="database" class="w-3.5 h-3.5"></i>
                  <span>${state.dbOnline ? 'Đang kết nối dữ liệu Supabase' : 'Chế độ dữ liệu cục bộ'} • ${VOCAB.length} từ vựng</span>

              <div class="grid grid-cols-3 gap-2.5 sm:min-w-[260px]">

                  <div class="text-xl font-extrabold">${totalLearned}/${VOCAB.length}</div>
                  <div class="text-[11px] text-emerald-100 font-medium">Đã thuộc</div>
                </div>
                <div class="bg-white/15 backdrop-blur-xs rounded-2xl p-3 text-center">
                  <div class="text-xl font-extrabold">${state.favorites.size}</div>
                  <div class="text-[11px] text-emerald-100 font-medium">Yêu thích</div>
                </div>
                <div class="bg-white/15 backdrop-blur-xs rounded-2xl p-3 text-center">
                  <div class="text-xl font-extrabold">${state.bestQuizScore}%</div>

              </div>
            </div>
          </div>

          <!-- Quick Search Bar -->
          <div>
            <div class="relative">

                  <span>Tải lại dữ liệu</span>
                </button>
                <button data-action="open-topic-quiz" data-topic="all" type="button"
                  class="text-xs font-bold text-emerald-700 hover:text-emerald-800 flex items-center gap-1">
                  <span>Kiểm tra tổng hợp</span>
                  <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>

              ${topicCardsHtml}

    // ==================== LEARN VIEW ====================
    function renderLearn(onlyFavorites = false) {
      let words = onlyFavorites
        ? VOCAB.filter(w => state.favorites.has(w.id))
        : getWordsByTopic(state.topicFilter);

      const headerTitle = onlyFavorites ? 'Từ vựng yêu thích' : 'Học từ vựng qua hình ảnh';
      const headerSub = onlyFavorites
        ? 'Danh sách các từ bạn đã đánh dấu sao để ôn tập nhanh.'
        : 'Chạm nút loa để nghe phát âm chuẩn, hoặc bấm vào thẻ để xem ví dụ và cụm từ đi kèm.';

      const filterPills = onlyFavorites ? '' : `
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
          ${TOPICS.map(t => {
            const active = state.topicFilter === t.id;
            const count = getWordsByTopic(t.id).length;
            return `
              <button data-action="set-topic-filter" data-topic="${escapeAttr(t.id)}" type="button"
                class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap border transition ${
                  active
                    ? 'bg-emerald-600 text-white border-emerald-600 shadow-xs'
                    : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
                }">
                ${escapeHtml(t.name)} (${count})
              </button>
            `;
          }).join('')}
          <button data-action="set-topic-filter" data-topic="all" type="button"
            class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap border transition ${
              state.topicFilter === 'all'
                ? 'bg-emerald-600 text-white border-emerald-600 shadow-xs'
                : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
            }">
            Tất cả (${VOCAB.length})
          </button>
        </div>
      `;

      const gridHtml = words.length ? `
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          ${words.map(w => {
            const isFav = state.favorites.has(w.id);
            const isDone = state.learned.has(w.id);
            const topicObj = getTopicObj(w.topic);
            const ipa = state.accent === 'UK' ? w.ipaUK : w.ipaUS;
            return `
              <article class="bg-white rounded-2xl border ${isDone ? 'border-emerald-300 ring-1 ring-emerald-100' : 'border-slate-200'} overflow-hidden shadow-2xs card-hover flex flex-col">
                <div class="relative aspect-[4/3] bg-white p-3 flex items-center justify-center border-b border-slate-100 cursor-pointer" data-action="open-modal" data-id="${escapeAttr(w.id)}">
                  ${renderWordVisual(w, 'w-12 h-12')}
                  <span class="absolute top-2.5 left-2.5 text-[10px] font-bold px-2 py-0.5 rounded-md ${topicObj.accentBg} ${topicObj.accentText}">${escapeHtml(topicObj.name)}</span>
                  <button data-action="toggle-fav" data-id="${escapeAttr(w.id)}" type="button" title="Yêu thích"
                    class="absolute top-2 right-2 w-8 h-8 rounded-full bg-white/90 border border-slate-200 flex items-center justify-center hover:scale-105 transition">
                    <i data-lucide="star" class="w-4 h-4 ${isFav ? 'text-amber-400 fill-amber-400' : 'text-slate-400'}"></i>
                  </button>
                  ${isDone ? `
                    <span class="absolute bottom-2 right-2 inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-600 text-white">
                      <i data-lucide="check" class="w-3 h-3"></i> Đã thuộc
                    </span>
                  ` : ''}
                </div>
                <div class="p-4 flex-1 flex flex-col justify-between">
                  <div class="cursor-pointer" data-action="open-modal" data-id="${escapeAttr(w.id)}">
                    <div class="flex items-center justify-between gap-2">
                      <h3 class="text-lg font-extrabold text-slate-900">${escapeHtml(w.word)}</h3>
                      <span class="text-[11px] font-semibold px-2 py-0.5 rounded-md bg-slate-100 text-slate-600">${escapeHtml(w.pos)}</span>
                    </div>
                    <div class="text-xs text-slate-500 font-medium mt-0.5">${escapeHtml(ipa)}</div>
                    <p class="text-sm font-semibold text-emerald-700 mt-2">${escapeHtml(w.vi)}</p>
                    <p class="text-xs text-slate-500 mt-1 line-clamp-2">${escapeHtml(w.enDef)}</p>
                  </div>
                  <div class="flex items-center gap-2 mt-4 pt-3 border-t border-slate-100">
                    <button data-action="speak-vocab" data-id="${escapeAttr(w.id)}" type="button"
                      class="flex-1 py-2 px-3 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-bold flex items-center justify-center gap-1.5 transition">
                      <i data-lucide="volume-2" class="w-4 h-4"></i>
                      <span>Nghe (${state.accent})</span>
                    </button>
                    <button data-action="toggle-learned" data-id="${escapeAttr(w.id)}" type="button"
                      class="py-2 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1 transition ${
                        isDone
                          ? 'bg-emerald-600 text-white hover:bg-emerald-700'
                          : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                      }">
                      <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                      <span>${isDone ? 'Thuộc' : 'Đánh dấu'}</span>
                    </button>
                  </div>
                </div>
              </article>
            `;
          }).join('')}
        </div>
      ` : `
        <div class="bg-white rounded-3xl border border-slate-200 p-10 text-center">
          <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center mx-auto mb-3">
            <i data-lucide="star" class="w-6 h-6"></i>
          </div>
          <h3 class="font-bold text-slate-900">Chưa có từ vựng nào</h3>
          <p class="text-sm text-slate-500 mt-1">${onlyFavorites ? 'Bấm vào ngôi sao trên bất kỳ thẻ từ nào để lưu vào đây ôn tập.' : 'Bạn có thể nạp thêm từ mới vào bảng vocab trên Supabase.'}</p>
          <button data-action="go-learn" type="button" class="mt-4 px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-sm font-bold hover:bg-emerald-700 transition">
            Xem tất cả từ vựng
          </button>
        </div>
      `;

      return `
        <section class="space-y-5">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">

              <p class="text-sm text-slate-500 mt-0.5">${headerSub}</p>
            </div>
            ${onlyFavorites && words.length ? `
              <button data-action="fc-favorites" type="button"
                class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold flex items-center gap-1.5 self-start sm:self-auto transition">
                <i data-lucide="layers" class="w-4 h-4"></i>
                <span>Ôn Flashcard mục yêu thích</span>
              </button>
            ` : `
              <div class="flex items-center gap-2">
                <button data-action="open-topic-flashcard" data-topic="${escapeAttr(state.topicFilter)}" type="button"
                  class="px-3.5 py-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-bold flex items-center gap-1.5 transition">
                  <i data-lucide="layers" class="w-4 h-4 text-emerald-600"></i>
                  <span>Flashcard</span>
                </button>
                <button data-action="open-topic-quiz" data-topic="${escapeAttr(state.topicFilter)}" type="button"
                  class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold flex items-center gap-1.5 transition">
                  <i data-lucide="zap" class="w-4 h-4"></i>
                  <span>Làm bài test</span>
                </button>
              </div>
            `}
          </div>
          ${filterPills}
          ${gridHtml}
        </section>
      `;
    }

    // ==================== FLASHCARD VIEW ====================
    function initFlashcards() {
      let pool = getWordsByTopic(state.topicFilter);
      if (state.fcFilter === 'unlearned') {
        pool = pool.filter(w => !state.learned.has(w.id));
      } else if (state.fcFilter === 'favorites') {
        pool = VOCAB.filter(w => state.favorites.has(w.id));
      }
      state.fcDeck = pool;
      state.fcIndex = 0;
      state.fcFlipped = false;
    }

    function renderFlashcard() {
      const deck = state.fcDeck;
      const current = deck[state.fcIndex];

      const controlsTop = `
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-1.5 flex-wrap">
            ${TOPICS.map(t => `
              <button data-action="fc-topic" data-topic="${escapeAttr(t.id)}" type="button"
                class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${
                  state.topicFilter === t.id && state.fcFilter !== 'favorites'
                    ? 'bg-emerald-600 text-white border-emerald-600'
                    : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
                }">${escapeHtml(t.name)}</button>
            `).join('')}
            <button data-action="fc-topic" data-topic="all" type="button"
              class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${
                state.topicFilter === 'all' && state.fcFilter !== 'favorites'
                  ? 'bg-emerald-600 text-white border-emerald-600'
                  : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
              }">Tất cả</button>
            <button data-action="fc-filter-mode" data-mode="unlearned" type="button"
              class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${
                state.fcFilter === 'unlearned'
                  ? 'bg-amber-500 text-white border-amber-500'
                  : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
              }">Chưa thuộc</button>
            <button data-action="fc-filter-mode" data-mode="favorites" type="button"
              class="px-3 py-1.5 rounded-xl text-xs font-bold border transition ${
                state.fcFilter === 'favorites'
                  ? 'bg-indigo-600 text-white border-indigo-600'
                  : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'
              }">Yêu thích</button>
          </div>
          <button data-action="fc-shuffle" type="button"
            class="px-3 py-1.5 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-xs font-bold text-slate-700 flex items-center gap-1.5">
            <i data-lucide="shuffle" class="w-3.5 h-3.5"></i> Xáo thẻ
          </button>
        </div>
      `;

      if (!current) {
        return `
          <section class="space-y-5 max-w-2xl mx-auto">
            <div>
              <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900">Ôn tập Flashcard</h1>
              <p class="text-sm text-slate-500 mt-0.5">Chạm vào thẻ để lật xem nghĩa tiếng Việt, phiên âm và ví dụ.</p>
            </div>
            ${controlsTop}
            <div class="bg-white rounded-3xl border border-slate-200 p-10 text-center">
              <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center mx-auto mb-3">
                <i data-lucide="check-circle-2" class="w-6 h-6"></i>
              </div>
              <h3 class="font-bold text-slate-900">Không còn thẻ nào trong bộ lọc này</h3>
              <p class="text-sm text-slate-500 mt-1">Bạn đã hoàn thành nhóm thẻ này hoặc chưa lưu từ yêu thích.</p>
              <button data-action="fc-reset-all" type="button" class="mt-4 px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-sm font-bold hover:bg-emerald-700 transition">
                Xem lại tất cả thẻ
              </button>
            </div>
          </section>
        `;
      }

      const ipa = state.accent === 'UK' ? current.ipaUK : current.ipaUS;
      const topicObj = getTopicObj(current.topic);
      const isDone = state.learned.has(current.id);
      const isFav = state.favorites.has(current.id);

      return `
        <section class="space-y-5 max-w-2xl mx-auto">
          <div class="flex items-center justify-between gap-2">
            <div>
              <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900">Ôn tập Flashcard</h1>
              <p class="text-sm text-slate-500 mt-0.5">Nhìn hình đoán từ, sau đó chạm thẻ để lật kiểm tra đáp án.</p>
            </div>
            <span class="text-xs font-extrabold px-3 py-1.5 rounded-full bg-white border border-slate-200 text-slate-700">
              ${state.fcIndex + 1} / ${deck.length}
            </span>
          </div>

          ${controlsTop}

          <div class="w-full h-1.5 bg-slate-200 rounded-full overflow-hidden">
            <div class="bg-emerald-500 h-full transition-all duration-300" style="width: ${Math.round(((state.fcIndex + 1) / deck.length) * 100)}%"></div>
          </div>

          <div class="perspective-1000">
            <div id="flashcard-inner" data-action="fc-flip"
              class="relative w-full min-h-[380px] sm:min-h-[410px] preserve-3d card-flip cursor-pointer ${state.fcFlipped ? 'rotate-y-180' : ''}">

              <!-- Front -->
              <div class="absolute inset-0 backface-hidden bg-white rounded-3xl border border-slate-200 shadow-sm p-6 flex flex-col justify-between">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-bold px-2.5 py-1 rounded-lg ${topicObj.accentBg} ${topicObj.accentText}">${escapeHtml(topicObj.name)}</span>
                  <div class="flex items-center gap-1.5">

              <!-- Back -->
              <div class="absolute inset-0 backface-hidden rotate-y-180 bg-white rounded-3xl border-2 border-emerald-200 shadow-sm p-6 flex flex-col justify-between">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-bold px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700">${escapeHtml(current.pos)} • ${escapeHtml(current.level)}</span>
                  <button data-action="speak-vocab" data-id="${escapeAttr(current.id)}" type="button"
                    class="px-3 py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-bold flex items-center gap-1.5 transition">
                    <i data-lucide="volume-2" class="w-4 h-4"></i> Nghe lại
                  </button>
                </div>

                <div class="text-center my-2 space-y-2">
                  <h2 class="text-3xl font-extrabold text-slate-900">${escapeHtml(current.word)}</h2>
                  <div class="text-sm font-medium text-slate-500">${escapeHtml(ipa)}</div>
                  <div class="text-xl font-bold text-emerald-700 pt-1">${escapeHtml(current.vi)}</div>
                  <p class="text-sm text-slate-600 max-w-md mx-auto">${escapeHtml(current.enDef)}</p>
                </div>

                <div class="bg-slate-50 rounded-2xl p-3.5 border border-slate-100 text-left">
                  <div class="flex items-start justify-between gap-2">
                    <div>
                      <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Ví dụ</p>
                      <p class="text-sm font-medium text-slate-800">${escapeHtml(current.example)}</p>
                      <p class="text-xs text-slate-500 mt-1">${escapeHtml(current.exampleVi)}</p>
                    </div>
                    <button data-action="speak-word" data-text="${escapeAttr(current.example)}" type="button"
                      class="w-8 h-8 rounded-lg bg-white border border-slate-200 text-emerald-600 hover:bg-emerald-50 flex items-center justify-center shrink-0">

                </div>
              </div>

            </div>
          </div>

          <div class="grid grid-cols-4 gap-2.5">
            <button data-action="fc-prev" type="button"
              class="py-3 rounded-2xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold text-xs flex items-center justify-center gap-1 transition">
              <i data-lucide="chevron-left" class="w-4 h-4"></i> Trước
            </button>
            <button data-action="fc-mark-review" type="button"
              class="py-3 rounded-2xl bg-amber-50 border border-amber-200 hover:bg-amber-100 text-amber-800 font-bold text-xs flex items-center justify-center gap-1 transition">
              <i data-lucide="refresh-cw" class="w-4 h-4"></i> Ôn lại
            </button>
            <button data-action="fc-mark-learned" type="button"
              class="py-3 rounded-2xl ${isDone ? 'bg-emerald-700' : 'bg-emerald-600'} hover:bg-emerald-700 text-white font-bold text-xs flex items-center justify-center gap-1 transition">
              <i data-lucide="check" class="w-4 h-4"></i> Đã thuộc
            </button>
            <button data-action="fc-next" type="button"
              class="py-3 rounded-2xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold text-xs flex items-center justify-center gap-1 transition">
              Tiếp <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>
        </section>
      `;
    }

    // ==================== QUIZ VIEW ====================
    function shuffleArr(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startQuiz() {
      const pool = getWordsByTopic(state.quizTopic);
      // Cap each quiz session at 15 questions so even 100-word topics stay snappy
      const chosen = shuffleArr(pool).slice(0, 15);
      const questions = chosen.map(word => {
        const distractors = shuffleArr(VOCAB.filter(w => w.id !== word.id)).slice(0, 3);
        const options = shuffleArr([word, ...distractors]);
        return { word, options };
      });
      state.quizQuestions = questions;
      state.quizIndex = 0;
      state.quizScore = 0;
      state.quizAnswered = false;
      state.quizSelectedOption = null;
      state.quizMistakes = [];
      state.quizActive = true;
      if (state.quizMode === 'spelling') setupSpellingForCurrent();
      render();
      if (state.quizMode === 'listen2pic' && questions[0]) {
        setTimeout(() => speakText(questions[0].word.word, state.accent, state.speechRate, questions[0].word), 250);
      }
    }

    function setupSpellingForCurrent() {
      const q = state.quizQuestions[state.quizIndex];
      if (!q) return;
      const letters = q.word.word.replace(/\s+/g, '').split('');
      state.spellTiles = shuffleArr(letters.map((ch, idx) => ({ id: idx, ch, used: false })));
      state.spellPicked = [];
      state.spellStatus = null;
    }

    function renderQuizSetup() {
      const modes = [
        { id: 'pic2word', title: 'Nhìn hình chọn từ', desc: 'Xem hình minh họa và chọn đúng từ tiếng Anh trong 4 đáp án.', icon: 'image' },
        { id: 'listen2pic', title: 'Nghe chọn hình', desc: 'Nghe phát âm tiếng Anh và chọn đúng hình minh họa tương ứng.', icon: 'headphones' },
        { id: 'spelling', title: 'Luyện ghép chữ', desc: 'Nhìn hình + nghĩa tiếng Việt và ghép các chữ cái thành từ hoàn chỉnh.', icon: 'keyboard' }
      ];

      return `
        <section class="max-w-2xl mx-auto space-y-6">
          <div>
            <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900">Kiểm tra từ vựng</h1>
            <p class="text-sm text-slate-500 mt-0.5">Chọn chủ đề và chế độ luyện tập (tối đa 15 câu ngẫu nhiên mỗi lượt).</p>
          </div>

          <div class="bg-white rounded-3xl border border-slate-200 p-5 space-y-5 shadow-2xs">
            <div>
              <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2.5">1. Chọn chủ đề</label>
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                ${TOPICS.map(t => {
                  const active = state.quizTopic === t.id;
                  const c = Math.min(15, getWordsByTopic(t.id).length);
                  return `
                    <button data-action="quiz-set-topic" data-topic="${escapeAttr(t.id)}" type="button"
                      class="p-3 rounded-2xl border text-left transition ${
                        active
                          ? 'bg-emerald-50 border-emerald-500 text-emerald-900 ring-1 ring-emerald-500'
                          : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'
                      }">
                      <div class="font-bold text-sm">${escapeHtml(t.name)}</div>
                      <div class="text-xs ${active ? 'text-emerald-700' : 'text-slate-500'}">${c} câu</div>
                    </button>
                  `;
                }).join('')}
                <button data-action="quiz-set-topic" data-topic="all" type="button"
                  class="p-3 rounded-2xl border text-left transition ${
                    state.quizTopic === 'all'
                      ? 'bg-emerald-50 border-emerald-500 text-emerald-900 ring-1 ring-emerald-500'
                      : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'
                  }">
                  <div class="font-bold text-sm">Tổng hợp</div>
                  <div class="text-xs ${state.quizTopic === 'all' ? 'text-emerald-700' : 'text-slate-500'}">${Math.min(15, VOCAB.length)} câu</div>
                </button>
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2.5">2. Chọn chế độ kiểm tra</label>
              <div class="space-y-2.5">
                ${modes.map(m => {
                  const active = state.quizMode === m.id;
                  return `
                    <button data-action="quiz-set-mode" data-mode="${m.id}" type="button"
                      class="w-full p-4 rounded-2xl border text-left flex items-center gap-3.5 transition ${
                        active
                          ? 'bg-emerald-50 border-emerald-500 ring-1 ring-emerald-500'
                          : 'bg-white border-slate-200 hover:bg-slate-50'
                      }">
                      <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${
                        active ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'
                      }">
                        <i data-lucide="${m.icon}" class="w-5 h-5"></i>
                      </div>
                      <div class="flex-1">
                        <div class="font-bold text-sm text-slate-900">${m.title}</div>
                        <div class="text-xs text-slate-500 mt-0.5">${m.desc}</div>
                      </div>
                      <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center ${
                        active ? 'border-emerald-600 bg-emerald-600' : 'border-slate-300'
                      }">
                        ${active ? '<div class="w-2 h-2 rounded-full bg-white"></div>' : ''}
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <button data-action="quiz-start" type="button"
              class="w-full py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-sm flex items-center justify-center gap-2 shadow-sm transition">
              <i data-lucide="play" class="w-4 h-4"></i>
              <span>Bắt đầu kiểm tra</span>
            </button>
          </div>
        </section>
      `;
    }

    function renderQuizActive() {
      const total = state.quizQuestions.length;
      if (state.quizIndex >= total) {
        const pct = total ? Math.round((state.quizScore / total) * 100) : 0;
        if (pct > state.bestQuizScore) {
          state.bestQuizScore = pct;
          saveState();
        }
        return `
          <section class="max-w-xl mx-auto">
            <div class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 text-center shadow-sm space-y-5">
              <div class="w-16 h-16 rounded-3xl ${pct >= 80 ? 'bg-emerald-100 text-emerald-600' : 'bg-amber-100 text-amber-600'} flex items-center justify-center mx-auto">
                <i data-lucide="trophy" class="w-8 h-8"></i>
              </div>
              <div>
                <h2 class="text-2xl font-extrabold text-slate-900">Hoàn thành bài kiểm tra!</h2>
                <p class="text-sm text-slate-500 mt-1">Bạn trả lời đúng <strong class="text-slate-900">${state.quizScore}/${total}</strong> câu (${pct}%).</p>
              </div>

              ${state.quizMistakes.length ? `
                <div class="text-left bg-rose-50/70 border border-rose-100 rounded-2xl p-4 space-y-2.5">
                  <div class="text-xs font-bold text-rose-700 uppercase tracking-wider">Từ cần ôn lại (${state.quizMistakes.length})</div>
                  ${state.quizMistakes.map(w => `
                    <div class="flex items-center justify-between gap-2 bg-white p-2.5 rounded-xl border border-rose-100">
                      <div class="flex items-center gap-2.5">
                        <div class="w-11 h-9 rounded-lg border border-slate-100 p-0.5 flex items-center justify-center overflow-hidden">
                          ${renderWordVisual(w, 'w-5 h-5')}
                        </div>
                        <div>
                          <div class="font-bold text-sm text-slate-900">${escapeHtml(w.word)}</div>
                          <div class="text-xs text-slate-500">${escapeHtml(w.vi)}</div>
                        </div>
                      </div>
                      <button data-action="speak-vocab" data-id="${escapeAttr(w.id)}" type="button"
                        class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-700 flex items-center justify-center">
                        <i data-lucide="volume-2" class="w-4 h-4"></i>
                      </button>
                    </div>
                  `).join('')}
                </div>
              ` : `
                <div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-sm font-semibold text-emerald-800">
                  Xuất sắc! Bạn đã trả lời chính xác toàn bộ các từ vựng.
                </div>
              `}

              <div class="grid grid-cols-2 gap-3 pt-2">
                <button data-action="quiz-exit" type="button"
                  class="py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-sm transition">
                  Đổi chế độ
                </button>
                <button data-action="quiz-start" type="button"
                  class="py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm transition">
                  Làm lại
                </button>
              </div>
            </div>
          </section>
        `;
      }

      const q = state.quizQuestions[state.quizIndex];
      const w = q.word;
      const pct = Math.round(((state.quizIndex) / total) * 100);
      let bodyHtml = '';

      if (state.quizMode === 'pic2word') {
        bodyHtml = `
          <div class="bg-white rounded-3xl border border-slate-200 p-5 flex flex-col items-center">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Nhìn hình và chọn từ tiếng Anh đúng</p>
            <div class="w-full max-w-xs aspect-[4/3] bg-white rounded-2xl border border-slate-100 p-3 flex items-center justify-center mb-4">
              ${renderWordVisual(w, 'w-14 h-14')}
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 w-full">
              ${q.options.map(opt => {
                let cls = 'bg-slate-50 border-slate-200 hover:bg-slate-100 text-slate-800';
                if (state.quizAnswered) {
                  if (opt.id === w.id) cls = 'bg-emerald-50 border-emerald-500 text-emerald-900 ring-1 ring-emerald-500';
                  else if (opt.id === state.quizSelectedOption) cls = 'bg-rose-50 border-rose-400 text-rose-800';
                  else cls = 'bg-slate-50 border-slate-200 text-slate-400 opacity-70';
                }
                return `
                  <button data-action="quiz-answer" data-opt="${escapeAttr(opt.id)}" type="button" ${state.quizAnswered ? 'disabled' : ''}
                    class="p-3.5 rounded-2xl border font-bold text-sm text-left flex items-center justify-between transition ${cls}">
                    <span>${escapeHtml(opt.word)}</span>
                    ${state.quizAnswered && opt.id === w.id ? '<i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-600"></i>' : ''}
                    ${state.quizAnswered && opt.id === state.quizSelectedOption && opt.id !== w.id ? '<i data-lucide="x-circle" class="w-4 h-4 text-rose-500"></i>' : ''}
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      } else if (state.quizMode === 'listen2pic') {
        bodyHtml = `
          <div class="bg-white rounded-3xl border border-slate-200 p-5 flex flex-col items-center">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Nghe phát âm và chọn đúng hình minh họa</p>
            <div class="flex items-center gap-3 mb-5">
              <button data-action="speak-vocab" data-id="${escapeAttr(w.id)}" type="button"
                class="px-5 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm flex items-center gap-2 shadow-xs transition">
                <i data-lucide="volume-2" class="w-5 h-5"></i>
                <span>Nghe phát âm</span>
              </button>
              <button data-action="speak-slow" data-id="${escapeAttr(w.id)}" type="button"
                class="px-3.5 py-3 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs flex items-center gap-1.5 transition">
                <i data-lucide="gauge" class="w-4 h-4"></i>
                <span>Chậm</span>
              </button>
            </div>
            ${state.quizAnswered ? `<div class="mb-4 text-sm font-bold text-emerald-700">${escapeHtml(w.word)} — ${escapeHtml(w.vi)}</div>` : ''}
            <div class="grid grid-cols-2 gap-3 w-full">
              ${q.options.map(opt => {
                let cls = 'border-slate-200 hover:border-emerald-400 bg-white';
                if (state.quizAnswered) {
                  if (opt.id === w.id) cls = 'border-emerald-500 ring-2 ring-emerald-500 bg-emerald-50/40';
                  else if (opt.id === state.quizSelectedOption) cls = 'border-rose-400 ring-2 ring-rose-300 bg-rose-50/40';
                  else cls = 'border-slate-200 opacity-50';
                }
                return `
                  <button data-action="quiz-answer" data-opt="${escapeAttr(opt.id)}" type="button" ${state.quizAnswered ? 'disabled' : ''}
                    class="rounded-2xl border-2 p-2.5 flex flex-col items-center transition ${cls}">
                    <div class="aspect-[4/3] w-full flex items-center justify-center overflow-hidden">
                      ${renderWordVisual(opt, 'w-10 h-10')}
                    </div>
                    ${state.quizAnswered ? `<span class="text-xs font-bold mt-1.5 text-slate-700">${escapeHtml(opt.word)}</span>` : ''}
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      } else {
        const targetClean = w.word.replace(/\s+/g, '');
        const targetWords = w.word.split(' ');
        let charPointer = 0;
        const slotsHtml = targetWords.map(part => {
          const boxes = part.split('').map(() => {
            const pickedItem = state.spellPicked[charPointer];
            const idx = charPointer;
            charPointer++;
            const boxStyle = state.spellStatus === 'correct'
              ? 'border-emerald-500 bg-emerald-50 text-emerald-800'
              : state.spellStatus === 'wrong'
                ? 'border-rose-400 bg-rose-50 text-rose-700'
                : pickedItem
                  ? 'border-emerald-400 bg-white text-slate-900'
                  : 'border-slate-300 border-dashed bg-slate-50 text-slate-300';
            return `
              <button data-action="spell-remove" data-pos="${idx}" type="button" ${state.quizAnswered || !pickedItem ? 'disabled' : ''}
                class="w-9 h-10 sm:w-10 sm:h-11 rounded-xl border-2 font-extrabold text-base flex items-center justify-center transition ${boxStyle}">
                ${pickedItem ? escapeHtml(pickedItem.ch) : ''}
              </button>
            `;
          }).join('');
          return `<div class="flex items-center gap-1.5 flex-wrap justify-center">${boxes}</div>`;
        }).join('<div class="w-3"></div>');

        bodyHtml = `
          <div class="bg-white rounded-3xl border border-slate-200 p-5 flex flex-col items-center space-y-4">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Ghép chữ cái thành từ tiếng Anh đúng</p>
            <div class="w-full max-w-[230px] aspect-[4/3] bg-white rounded-2xl border border-slate-100 p-2.5 flex items-center justify-center">
              ${renderWordVisual(w, 'w-12 h-12')}
            </div>
            <div class="flex items-center gap-2">
              <span class="text-base font-extrabold text-emerald-700">${escapeHtml(w.vi)}</span>
              <button data-action="speak-vocab" data-id="${escapeAttr(w.id)}" type="button"
                class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-700 hover:bg-emerald-100 flex items-center justify-center">
                <i data-lucide="volume-2" class="w-4 h-4"></i>
              </button>
            </div>

            <div class="flex items-center justify-center flex-wrap gap-y-2 py-1">
              ${slotsHtml}
            </div>

            ${state.spellStatus === 'wrong' ? `
              <div class="text-xs font-bold text-rose-600">Đáp án đúng: <span class="text-slate-900">${escapeHtml(w.word)}</span></div>
            ` : ''}

            <div class="flex flex-wrap items-center justify-center gap-2 pt-1 max-w-md">
              ${state.spellTiles.map(tile => `
                <button data-action="spell-pick" data-tid="${tile.id}" type="button" ${tile.used || state.quizAnswered ? 'disabled' : ''}
                  class="w-10 h-10 rounded-xl font-extrabold text-sm border transition ${
                    tile.used
                      ? 'bg-slate-100 text-slate-300 border-slate-100 cursor-default'
                      : 'bg-white text-slate-800 border-slate-200 shadow-2xs hover:border-emerald-400 hover:bg-emerald-50'
                  }">
                  ${escapeHtml(tile.ch)}
                </button>
              `).join('')}
            </div>

            ${!state.quizAnswered ? `
              <div class="flex items-center gap-2 pt-2">
                <button data-action="spell-hint" type="button"
                  class="px-3.5 py-2 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-800 text-xs font-bold flex items-center gap-1.5">
                  <i data-lucide="lightbulb" class="w-3.5 h-3.5"></i> Gợi ý 1 chữ
                </button>
                <button data-action="spell-clear" type="button"
                  class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold flex items-center gap-1.5">
                  <i data-lucide="eraser" class="w-3.5 h-3.5"></i> Xóa hết
                </button>
                <button data-action="spell-check" type="button" ${state.spellPicked.length < targetClean.length ? 'disabled' : ''}
                  class="px-4 py-2 rounded-xl text-xs font-bold transition ${
                    state.spellPicked.length < targetClean.length
                      ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
                      : 'bg-emerald-600 hover:bg-emerald-700 text-white'
                  }">
                  Kiểm tra
                </button>
              </div>
            ` : ''}
          </div>
        `;
      }

      return `
        <section class="max-w-2xl mx-auto space-y-4">
          <div class="flex items-center justify-between gap-3">

          </div>
          <div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 space-y-1">

            <p class="text-xs text-emerald-700">Tiến độ đã thuộc và từ yêu thích của bạn đang được lưu tự động trên Supabase.</p>

        `;
      } else {
        const isLogin = state.authMode === 'login';
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-extrabold text-slate-900">${isLogin ? 'Đăng nhập đồng bộ tiến độ' : 'Tạo tài khoản học mới'}</h3>
            <button data-action="close-auth-modal" type="button" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600">

            </button>
          </div>
          <p class="text-xs text-slate-500">Đăng nhập giúp lưu các từ đã thuộc &amp; yêu thích lên Supabase để học trên nhiều thiết bị và không mất dữ liệu khi đổi giao diện.</p>
          ${state.authError ? `<div class="p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs font-semibold text-rose-700">${escapeHtml(state.authError)}</div>` : ''}
          ${state.authMessage ? `<div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-xs font-semibold text-emerald-700">${escapeHtml(state.authMessage)}</div>` : ''}
          <form id="auth-form" class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Email</label>
              <input id="auth-email" type="email" required placeholder="ban@example.com"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500" />
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Mật khẩu (tối thiểu 6 ký tự)</label>
              <input id="auth-password" type="password" minlength="6" required placeholder="••••••"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-500" />
            </div>
            <button type="submit" ${state.authBusy ? 'disabled' : ''}
              class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm transition">
              ${state.authBusy ? 'Đang xử lý...' : (isLogin ? 'Đăng nhập' : 'Đăng ký tài khoản')}
            </button>
          </form>
          <div class="text-center text-xs text-slate-500">
            ${isLogin ? 'Chưa có tài khoản?' : 'Đã có tài khoản?'}
            <button data-action="toggle-auth-mode" type="button" class="font-bold text-emerald-700 hover:underline ml-1">
              ${isLogin ? 'Đăng ký ngay' : 'Đăng nhập'}
            </button>
          </div>
        `;

        const form = document.getElementById('auth-form');
        if (form) {
          form.addEventListener('submit', async (ev) => {
            ev.preventDefault();
            if (!supabaseClient) {
              state.authError = 'Chưa kết nối được tới Supabase.';
              openAuthModal();
              return;
            }
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            state.authBusy = true;
            state.authError = '';
            state.authMessage = '';
            openAuthModal();
            try {
              if (state.authMode === 'login') {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) state.authError = error.message;
                else {
                  closeAuthModal();
                  showToast('Đăng nhập thành công!');
                  return;
                }
              } else {
                const { error } = await supabaseClient.auth.signUp({ email, password });
                if (error) state.authError = error.message;
                else state.authMessage = 'Đăng ký thành công! Nếu Supabase yêu cầu xác nhận email, hãy mở hộp thư để kích hoạt rồi đăng nhập.';

            } catch (err) {
              state.authError = 'Có lỗi kết nối, vui lòng thử lại.';
            }
            state.authBusy = false;
            openAuthModal();
          });
        }
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
      if (window.lucide) lucide.createIcons();
    }

    function closeModal() {
      const modal = document.getElementById('word-modal');
      if (modal) { modal.classList.add('hidden'); modal.classList.remove('flex'); }
      state.modalWordId = null;
    }
    function closeVoiceModal() {
      const modal = document.getElementById('voice-modal');
      if (modal) { modal.classList.add('hidden'); modal.classList.remove('flex'); }
    }
    function closeAuthModal() {
      const modal = document.getElementById('auth-modal');
      if (modal) { modal.classList.add('hidden'); modal.classList.remove('flex'); }
      state.authError = '';
      state.authMessage = '';
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function escapeAttr(str) {
      return escapeHtml(str).replace(/'/g, '&#39;');
    }

    // Main Render
    function render() {
      const main = document.getElementById('app-main');
      if (!main) return;
      if (state.loading && !VOCAB.length) {
        main.innerHTML = `
          <div class="bg-white rounded-3xl border border-slate-200 p-12 text-center space-y-3">
            <div class="w-10 h-10 border-4 border-emerald-200 border-t-emerald-600 rounded-full animate-spin mx-auto"></div>
            <p class="text-sm font-semibold text-slate-600">Đang tải dữ liệu từ vựng từ Supabase...</p>
          </div>
        `;
      } else if (state.view === 'home') {
        main.innerHTML = renderHome();
      } else if (state.view === 'learn') {
        main.innerHTML = renderLearn(false);
      } else if (state.view === 'favorites') {
        main.innerHTML = renderLearn(true);
      } else if (state.view === 'flashcard') {
        main.innerHTML = renderFlashcard();
      } else if (state.view === 'quiz') {
        main.innerHTML = state.quizActive ? renderQuizActive() : renderQuizSetup();
      }
      updateHeaderUI();
      if (window.lucide) lucide.createIcons();

      const searchEl = document.getElementById('home-search-input');
      if (searchEl) {
        searchEl.addEventListener('input', (e) => {
          state.searchQuery = e.target.value;
          const cursor = e.target.selectionStart;
          render();
          const newInput = document.getElementById('home-search-input');
          if (newInput) {
            newInput.focus();
            newInput.setSelectionRange(cursor, cursor);
          }
        });
      }
      const clearBtn = document.getElementById('btn-clear-search');
      if (clearBtn) {
        clearBtn.addEventListener('click', () => {
          state.searchQuery = '';
          render();
        });
      }
    }

    // Event Delegation
    document.addEventListener('click', async (e) => {
      const navBtn = e.target.closest('[data-nav]');
      if (navBtn) { setView(navBtn.dataset.nav); return; }

      if (e.target.closest('#btn-brand-home')) { setView('home'); return; }
      if (e.target.closest('#btn-accent')) {
        state.accent = state.accent === 'US' ? 'UK' : 'US';
        saveState();
        showToast('Đã chuyển sang giọng ' + (state.accent === 'US' ? 'Anh - Mỹ (US)' : 'Anh - Anh (UK)'));
        render();
        return;
      }
      if (e.target.closest('#btn-voice-settings')) { openVoiceModal(); return; }
      if (e.target.closest('#btn-auth')) { openAuthModal(); return; }

      if (e.target === document.getElementById('word-modal')) { closeModal(); return; }
      if (e.target === document.getElementById('voice-modal')) { closeVoiceModal(); return; }
      if (e.target === document.getElementById('auth-modal')) { closeAuthModal(); return; }

      const actEl = e.target.closest('[data-action]');
      if (!actEl) return;
      const action = actEl.dataset.action;

      if (action === 'reload-db') { loadDataFromSupabase(true); return; }
      if (action === 'speak-word') { e.stopPropagation(); speakText(actEl.dataset.text); return; }
      if (action === 'speak-vocab') {
        e.stopPropagation();
        const w = VOCAB.find(x => x.id === actEl.dataset.id);
        if (w) speakText(w.word, state.accent, state.speechRate, w);
        return;
      }
      if (action === 'speak-slow') {
        e.stopPropagation();
        const w = VOCAB.find(x => x.id === actEl.dataset.id);
        if (w) speakText(w.word, state.accent, 0.72, w);
        return;
      }
      if (action === 'speak-accent') {
        e.stopPropagation();
        const w = VOCAB.find(x => x.id === actEl.dataset.id);
        if (w) speakText(w.word, actEl.dataset.accent, state.speechRate, w);
        return;
      }
      if (action === 'set-speed') {
        state.speechRate = Number(actEl.dataset.rate) === 0.75 ? 0.75 : 1.0;
        saveState();
        openVoiceModal();
        return;
      }
      if (action === 'test-us-voice') {
        speakText('Scholarship', 'US', state.speechRate);
        return;
      }
      if (action === 'close-voice-modal') { closeVoiceModal(); return; }
      if (action === 'close-auth-modal') { closeAuthModal(); return; }
      if (action === 'toggle-auth-mode') {
        state.authMode = state.authMode === 'login' ? 'signup' : 'login';
        state.authError = '';
        state.authMessage = '';
        openAuthModal();
        return;
      }
      if (action === 'do-logout') {
        if (supabaseClient) await supabaseClient.auth.signOut();
        state.user = null;
        closeAuthModal();
        showToast('Đã đăng xuất');
        render();
        return;
      }
      if (action === 'toggle-fav') { e.stopPropagation(); toggleFavorite(actEl.dataset.id); return; }
      if (action === 'toggle-learned') { e.stopPropagation(); toggleLearned(actEl.dataset.id); return; }
      if (action === 'open-modal') {
        renderModal(actEl.dataset.id);
        const w = VOCAB.find(x => x.id === actEl.dataset.id);
        if (w) speakText(w.word, state.accent, state.speechRate, w);
        return;
      }
      if (action === 'close-modal') { closeModal(); return; }
      if (action === 'open-topic-learn') { setView('learn', { topic: actEl.dataset.topic }); return; }
      if (action === 'open-topic-flashcard') { setView('flashcard', { topic: actEl.dataset.topic, fcFilter: 'all' }); return; }
      if (action === 'open-topic-quiz') { setView('quiz', { quizTopic: actEl.dataset.topic, autoStart: false }); return; }
      if (action === 'set-topic-filter') { state.topicFilter = actEl.dataset.topic; render(); return; }
      if (action === 'go-learn') { setView('learn', { topic: 'all' }); return; }
      if (action === 'fc-favorites') { setView('flashcard', { fcFilter: 'favorites' }); return; }
      if (action === 'fc-topic') { state.topicFilter = actEl.dataset.topic; state.fcFilter = 'all'; initFlashcards(); render(); return; }
      if (action === 'fc-filter-mode') { state.fcFilter = state.fcFilter === actEl.dataset.mode ? 'all' : actEl.dataset.mode; initFlashcards(); render(); return; }
      if (action === 'fc-reset-all') { state.topicFilter = 'all'; state.fcFilter = 'all'; initFlashcards(); render(); return; }
      if (action === 'fc-shuffle') { state.fcDeck = shuffleArr(state.fcDeck); state.fcIndex = 0; state.fcFlipped = false; showToast('Đã xáo trộn thứ tự thẻ'); render(); return; }
      if (action === 'fc-flip') {
        state.fcFlipped = !state.fcFlipped;
        const inner = document.getElementById('flashcard-inner');
        if (inner) inner.classList.toggle('rotate-y-180', state.fcFlipped);
        const cur = state.fcDeck[state.fcIndex];
        if (state.fcFlipped && cur) speakText(cur.word, state.accent, state.speechRate, cur);
        return;
      }
      if (action === 'fc-prev') {
        if (!state.fcDeck.length) return;
        state.fcIndex = (state.fcIndex - 1 + state.fcDeck.length) % state.fcDeck.length;
        state.fcFlipped = false;
        render();
        return;
      }
      if (action === 'fc-next') {
        if (!state.fcDeck.length) return;
        state.fcIndex = (state.fcIndex + 1) % state.fcDeck.length;
        state.fcFlipped = false;
        render();
        return;
      }
      if (action === 'fc-mark-learned') {
        const cur = state.fcDeck[state.fcIndex];
        if (!cur) return;
        state.learned.add(cur.id);
        saveState();
        syncWordProgressToCloud(cur.id);
        playChime('correct');
        if (state.fcFilter === 'unlearned') {
          state.fcDeck.splice(state.fcIndex, 1);
          if (state.fcIndex >= state.fcDeck.length) state.fcIndex = 0;
        } else {
          state.fcIndex = (state.fcIndex + 1) % state.fcDeck.length;
        }
        state.fcFlipped = false;
        render();
        return;
      }
      if (action === 'fc-mark-review') {
        const cur = state.fcDeck[state.fcIndex];
        if (!cur) return;
        state.learned.delete(cur.id);
        saveState();
        syncWordProgressToCloud(cur.id);
        state.fcIndex = (state.fcIndex + 1) % state.fcDeck.length;
        state.fcFlipped = false;
        showToast('Đã chuyển sang thẻ tiếp theo để ôn lại sau');
        render();
        return;
      }

      if (action === 'quiz-set-topic') { state.quizTopic = actEl.dataset.topic; render(); return; }
      if (action === 'quiz-set-mode') { state.quizMode = actEl.dataset.mode; render(); return; }
      if (action === 'quiz-start') { startQuiz(); return; }
      if (action === 'quiz-exit') { state.quizActive = false; render(); return; }
      if (action === 'quiz-answer') {
        if (state.quizAnswered) return;
        const q = state.quizQuestions[state.quizIndex];
        const chosenId = actEl.dataset.opt;
        state.quizAnswered = true;
        state.quizSelectedOption = chosenId;
        if (chosenId === q.word.id) {
          state.quizScore++;
          state.learned.add(q.word.id);
          saveState();
          syncWordProgressToCloud(q.word.id);
          playChime('correct');
        } else {
          state.quizMistakes.push(q.word);
          playChime('wrong');
        }
        speakText(q.word.word, state.accent, state.speechRate, q.word);
        render();
        return;
      }
      if (action === 'quiz-next') {
        state.quizIndex++;
        state.quizAnswered = false;
        state.quizSelectedOption = null;
        if (state.quizMode === 'spelling' && state.quizIndex < state.quizQuestions.length) {
          setupSpellingForCurrent();
        }
        render();
        if (state.quizMode === 'listen2pic' && state.quizIndex < state.quizQuestions.length) {
          const nw = state.quizQuestions[state.quizIndex].word;
          setTimeout(() => speakText(nw.word, state.accent, state.speechRate, nw), 250);
        }
        return;
      }

      if (action === 'spell-pick') {
        if (state.quizAnswered) return;
        const tid = Number(actEl.dataset.tid);
        const tile = state.spellTiles.find(t => t.id === tid);
        if (!tile || tile.used) return;
        tile.used = true;
        state.spellPicked.push(tile);
        render();
        return;
      }
      if (action === 'spell-remove') {
        if (state.quizAnswered) return;
        const pos = Number(actEl.dataset.pos);
        const removed = state.spellPicked.splice(pos, 1)[0];
        if (removed) {
          const tile = state.spellTiles.find(t => t.id === removed.id);
          if (tile) tile.used = false;
        }
        render();
        return;
      }
      if (action === 'spell-clear') {
        if (state.quizAnswered) return;
        state.spellTiles.forEach(t => { t.used = false; });
        state.spellPicked = [];
        render();
        return;
      }
      if (action === 'spell-hint') {
        if (state.quizAnswered) return;
        const q = state.quizQuestions[state.quizIndex];
        const targetClean = q.word.word.replace(/\s+/g, '');
        const nextIdx = state.spellPicked.length;
        if (nextIdx >= targetClean.length) return;
        const neededChar = targetClean[nextIdx].toLowerCase();
        const matchTile = state.spellTiles.find(t => !t.used && t.ch.toLowerCase() === neededChar);
        if (matchTile) {
          matchTile.used = true;
          state.spellPicked.push(matchTile);
          render();
        }
        return;
      }
      if (action === 'spell-check') {
        if (state.quizAnswered) return;
        const q = state.quizQuestions[state.quizIndex];
        const targetClean = q.word.word.replace(/\s+/g, '').toLowerCase();
        const typed = state.spellPicked.map(t => t.ch).join('').toLowerCase();
        state.quizAnswered = true;
        if (typed === targetClean) {
          state.spellStatus = 'correct';
          state.quizScore++;
          state.learned.add(q.word.id);
          saveState();
          syncWordProgressToCloud(q.word.id);
          playChime('correct');
        } else {
          state.spellStatus = 'wrong';
          state.quizMistakes.push(q.word);
          playChime('wrong');
        }
        speakText(q.word.word, state.accent, state.speechRate, q.word);
        render();
        return;
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeModal();
        closeVoiceModal();
        closeAuthModal();
        return;
      }
      if (state.view === 'quiz' && state.quizActive && state.quizMode === 'spelling' && !state.quizAnswered) {
        if (e.key === 'Backspace' && state.spellPicked.length) {
          const removed = state.spellPicked.pop();
          const tile = state.spellTiles.find(t => t.id === removed.id);
          if (tile) tile.used = false;
          render();
        } else if (e.key.length === 1 && /[a-zA-Z]/.test(e.key)) {
          const ch = e.key.toLowerCase();
          const tile = state.spellTiles.find(t => !t.used && t.ch.toLowerCase() === ch);
          if (tile) {
            tile.used = true;
            state.spellPicked.push(tile);
            render();
          }
        }
      }
    });

    // Ensure browser voices load on Chrome/Cốc Cốc
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await loadDataFromSupabase(false);
      await initAuth();
    });
  </script>
</body>
</html>
